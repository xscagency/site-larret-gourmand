# Rappels Telegram des privatisations (7 jours avant, la veille, le jour même) : appelle le site chaque matin.
# Le site n'envoie qu'à partir de 9h (heure de Paris) et une seule fois par jour ; les deux horaires couvrent l'heure d'été et l'heure d'hiver.
# Aucun secret : l'adresse appelée ne peut rien faire d'autre que déclencher les rappels prévus.
name: Rappels privatisations
on:
  schedule:
    - cron: '5 7 * * *'   # 09:05 Paris en heure d'été
    - cron: '5 8 * * *'   # 09:05 Paris en heure d'hiver (le premier passage est ignoré avant 9h)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://site-larret-gourmand.pages.dev' }}
        run: curl -fsS -X POST "$SITE_URL/api/rappels/tick" 
  # GitHub coupe les tâches planifiées d'un dépôt sans activité depuis 60 jours : un commit vide le 1er du mois les maintient en vie.
  keepalive:
    if: github.event.schedule == '5 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vide mensuel
        run: |
          if [ "$(date -u +%d)" != "01" ]; then echo "pas le 1er du mois"; exit 0; fi
          git config user.name "rappels-bot"; git config user.email "rappels-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: maintien des tâches planifiées (rappels)"
          git push
